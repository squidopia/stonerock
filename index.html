<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stonerock News Corp - Adventure Game</title>
    <!-- Modern Sans-Serif Fonts for crisp readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #08090d;
            --container-bg: #11141d;
            --card-bg: #181c28;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-pink: #ff0055;
            --accent-pink-glow: rgba(255, 0, 85, 0.25);
            --green-accent: #00ff88;
            --green-glow: rgba(0, 255, 136, 0.2);
            --border-color: #262c3e;
            --border-hover: #3d4663;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Top News Ticker */
        .ticker-wrap {
            width: 100%;
            max-width: 820px;
            background: rgba(13, 15, 22, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-pink);
            border-radius: 8px;
            padding: 12px 18px;
            margin-bottom: 24px;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .ticker-label {
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ticker-label::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent-pink);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-pink);
        }

        .ticker-red {
            color: var(--accent-pink);
            font-weight: 700;
        }

        .ticker-green {
            color: var(--green-accent);
            font-weight: 700;
        }

        /* Main Game Layout */
        .game-container {
            width: 100%;
            max-width: 820px;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-pink), var(--green-accent));
        }

        .header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .theme-song {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Story Text Section */
        .story-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 28px;
        }

        .story-text {
            font-size: 1.125rem;
            line-height: 1.7;
            color: var(--text-main);
            white-space: pre-line;
            min-height: 100px;
        }

        /* Choices and Buttons */
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            padding: 18px 20px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: transparent;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #1e2435;
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
            padding-left: 24px;
        }

        .btn:hover::before {
            background-color: var(--accent-pink);
        }

        .btn-reset {
            background-color: rgba(255, 0, 85, 0.1);
            border: 1px solid var(--accent-pink);
            color: var(--accent-pink);
            font-weight: 600;
            justify-content: center;
            text-align: center;
            margin-top: 10px;
        }

        .btn-reset:hover {
            background-color: var(--accent-pink);
            color: #ffffff;
            padding-left: 20px;
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--accent-pink-glow);
        }

        .btn-reset:hover::before {
            background-color: transparent;
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-radius: 6px;
            margin-bottom: 16px;
            font-family: 'JetBrains Mono', monospace;
        }

        .badge-danger {
            background-color: var(--accent-pink-glow);
            color: var(--accent-pink);
            border: 1px solid rgba(255, 0, 85, 0.4);
        }

        .badge-success {
            background-color: var(--green-glow);
            color: var(--green-accent);
            border: 1px solid rgba(0, 255, 136, 0.4);
        }

        .badge-neutral {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        /* Mobile tweaks */
        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.6rem;
            }

            .ticker-wrap {
                flex-direction: column;
                gap: 6px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <!-- Stonerock Ticker -->
    <div class="ticker-wrap">
        <span class="ticker-label">STONEROCK LIVE TICKER</span>
        <span id="ticker-status" class="ticker-red">StonerockCoin: Loading...</span>
    </div>

    <!-- Main Game Frame -->
    <div class="game-container">
        <div class="header">
            <h1>Stonerock News Corp</h1>
            <div class="theme-song">🎶 S-S-STONEROCK! WE MAKE THE BEST SHIPS EVER! OUR DECISIONS ARE ALWAYS CLEVER! 🎶</div>
        </div>

        <div id="status-container"></div>
        
        <div class="story-card">
            <div class="story-text" id="story-display">Connecting to Stonerock database...</div>
        </div>

        <div class="choices-container" id="choices-display"></div>
    </div>

    <!-- Load App Logic -->
    <script src="app.js"></script>
</body>
</html>
