<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stonerock News Corp - Adventure Game</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --container-bg: #151821;
            --text-color: #e2e8f0;
            --accent-color: #ff0055;
            --green-accent: #00ff66;
            --border-color: #2a2e3d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .ticker-wrap {
            width: 100%;
            max-width: 800px;
            background: #000;
            border: 2px solid var(--accent-color);
            padding: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
        }

        .ticker-red {
            color: var(--accent-color);
        }

        .ticker-green {
            color: var(--green-accent);
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background-color: var(--container-bg);
            border: 3px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8em;
            color: var(--accent-color);
            letter-spacing: 2px;
        }

        .theme-song {
            font-style: italic;
            font-size: 0.85em;
            color: #8a92b2;
            margin-top: 5px;
        }

        .story-text {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
            min-height: 120px;
            white-space: pre-line;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background-color: #1e2230;
            border: 1px dashed var(--text-color);
            color: var(--text-color);
            padding: 15px;
            font-size: 1em;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn:hover {
            background-color: var(--accent-color);
            border-style: solid;
            color: #fff;
            transform: translateX(5px);
        }

        .btn-reset {
            background-color: #2d131b;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            text-align: center;
        }

        .btn-reset:hover {
            background-color: var(--accent-color);
            color: #fff;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 3px;
            margin-bottom: 15px;
        }

        .badge-danger {
            background-color: rgba(255, 0, 85, 0.2);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        .badge-success {
            background-color: rgba(0, 255, 102, 0.2);
            color: var(--green-accent);
            border: 1px solid var(--green-accent);
        }

        .badge-neutral {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid #fff;
        }
    </style>
</head>
<body>

    <!-- Stonerock Ticker -->
    <div class="ticker-wrap">
        <span>STONEROCK NEWS CORP LIVE TICKER:</span>
        <span id="ticker-status" class="ticker-red">StonerockCoin: Loading...</span>
    </div>

    <!-- Main Game Frame -->
    <div class="game-container">
        <div class="header">
            <h1>STONEROCK NEWS CORP</h1>
            <div class="theme-song">🎶 S-S-STONEROCK! S-S-STONEROCK! WE MAKE THE BEST SHIPS EVER! OUR DECISIONS ARE ALWAYS CLEVER! 🎶</div>
        </div>

        <div id="status-container"></div>
        <div class="story-text" id="story-display">Connecting to Stonerock database...</div>
        <div class="choices-container" id="choices-display"></div>
    </div>

    <!-- Load App Logic -->
    <script src="app.js"></script>
</body>
</html>
